quarkus.application.name=yeb-trips
quarkus.http.port=8083
quarkus.http.test-port=8084

# Configuracao para banco H2
#quarkus.datasource.db-kind=h2
#quarkus.datasource.jdbc.url=jdbc:h2:mem:default
#quarkus.hibernate-orm.database.generation=drop-and-create
#quarkus.datasource.dev-ui.allow-sql=true
#quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.active=false
# Configuração para dev / local Banco Dynamo
#quarkus.dynamodb.endpoint-override=http://localhost:8000
quarkus.dynamodb.aws.region=us-east-1
quarkus.dynamodb.aws.credentials.type=default
quarkus.dynamodb.aws.credentials.static-provider.access-key-id=test
quarkus.dynamodb.aws.credentials.static-provider.secret-access-key=test
# URL Base do serviço de cotações
quarkus.rest-client.awesome-api.url=https://economia.awesomeapi.com.br

# Timeouts a nível de socket/HTTP (em milissegundos)
quarkus.rest-client.awesome-api.connect-timeout=3000
quarkus.rest-client.awesome-api.read-timeout=5000

smallrye.jwt.sign.key=${SMALLRYE_JWT_SIGN_KEY}
mp.jwt.verify.publickey.location=publicKey.pem

# Emissor padrão do token
mp.jwt.verify.issuer=yeb-trips
smallrye.jwt.new-token.issuer=yeb-trips
smallrye.jwt.issuer=yeb-trips