quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:default
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.datasource.dev-ui.allow-sql=true
quarkus.hibernate-orm.log.sql=true
# URL Base do serviço de cotações
quarkus.rest-client.awesome-api.url=https://economia.awesomeapi.com.br

# Timeouts a nível de socket/HTTP (em milissegundos)
quarkus.rest-client.awesome-api.connect-timeout=3000
quarkus.rest-client.awesome-api.read-timeout=5000